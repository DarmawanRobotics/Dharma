# Per-node overrides of the Dharma package defaults for this robot (only what differs).
# Merged with params_file:= (later wins) and passed to every package launch. Each package's
# README lists its parameters; `ros2 param describe /<node> <name>` shows units and ranges.
# A section that matches no started node is reported at launch (typo).

control_mux_node:
  ros__parameters:
    use_health_limit: true # scale commands by health/status speed_scale
    remote_sources: [handheld, dashboard] # control/remote/<source>/cmd_vel

health_monitor_node:
  ros__parameters:
    sensors:
      topics: ["/livox/lidar:5.0", "/Odometry:8.0"] # "topic:min_hz[:max_age_sec]"
    nodes:
      # The bringup adds every node it starts; list the robot driver's nodes here.
      expected: [""]
    degradation:
      rules: ["sensor:/livox/lidar=0.5", "sensor:/Odometry=0.5", "tf:*=0.5"]
