# The robot profile: the one description of the robot every Dharma node reads (robot.*).
# Validated by the bringup at start (unknown names and out-of-range values stop the launch) and
# by every node (`ros2 param describe /<node> robot.limits.max_vx`). Replace the values with the
# robot's own: footprint from the body outline, limits below what the driver accepts.
/**:
  ros__parameters:
    robot:
      name: robot # model, for logs
      kinematics: omni # omni: vx, vy, wz (legged, mecanum); diff: vx, wz (max_vy must be 0)
      base_height: 0.35 # m, base_link above the floor when standing
      footprint: # m, base_link to the edges (x forward, y left)
        front: 0.40
        rear: 0.40
        half_width: 0.28
      limits:
        max_vx: 0.8 # m/s
        max_vy: 0.4 # m/s
        max_wz: 1.0 # rad/s
        max_accel: 0.5 # m/s^2
        max_decel: 0.6 # m/s^2, braking: the protective field and avoidance assume it
        max_yaw_accel: 1.5 # rad/s^2
        reaction_time: 0.25 # s, command to braking (sensing + transport)
      frames:
        map: map
        odom: odom
        base: base_link
