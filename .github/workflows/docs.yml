# The documentation site on GitHub Pages (https://darmawanrobotics.github.io/Dharma/): the wiki
# pages (docs/wiki) through docs/site/prepare.py and MkDocs Material, with the technical manual
# and the paper as PDFs. Pull requests build it (strict) without deploying.
# Repository settings once: Settings -> Pages -> Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - name: LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-publishers texlive-science cm-super-minimal
      - name: Manual and paper (PDF)
        run: make -C docs paper manual DRAWIO=nodrawio
      - name: MkDocs
        run: pip install -r docs/site/requirements.txt pytest
      - name: Tests of the site script
        run: python -m pytest -q docs/site/test
      - name: Site (strict)
        run: |
          python docs/site/prepare.py
          mkdocs build --strict -f docs/site/mkdocs.yml
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
